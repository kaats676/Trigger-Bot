plugins {
    id 'net.fabricmc.fabric-loom' version '1.7.4'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.example' // Можно заменить на свое, например 'net.triggerbot'

base {
    archivesName = 'Trigger-Bot'
}

repositories {
    maven { url = "https://fabricmc.net" }
    mavenCentral()
}

dependencies {
    // Minecraft и официальный маппинг Yarn для 1.21.1
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.2:v2"

    // Загрузчик Fabric (обязательно)
    modImplementation "net.fabricmc:fabric-loader:0.16.10"

    // Fabric API (модули событий, предметов и т.д., раскомментируйте если используете)
    // modImplementation "net.fabricmc.fabric-api:fabric-api:0.103.0+1.21.1"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesNotMatching("*.png") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(21)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}
