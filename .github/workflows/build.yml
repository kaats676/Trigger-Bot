name: Build TriggerBot Jar

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Trigger-Bot
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'microsoft'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.8

    - name: Generate Wrapper Files
      run: gradle wrapper

    - name: Build Mod with Gradle Wrapper
      run: ./gradlew build

    - name: Upload Finished Jar
      uses: actions/upload-artifact@v4
      with:
        name: TriggerBot-Fabric-1.21.1
        path: Trigger-Bot/build/libs/*-snapshot.jar
