name: Build TriggerBot Jar

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'microsoft'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.8

    # ХИТРОСТЬ: Принудительно перезаписываем settings.gradle прямо на сервере перед сборкой!
    - name: Force Fix Settings File
      run: |
        echo 'pluginManagement { repositories { maven { url = "https://fabricmc.net" }; gradlePluginPortal(); mavenCentral() } }' > settings.gradle
        echo 'rootProject.name = "triggerbot"' >> settings.gradle

    # ХИТРОСТЬ 2: Принудительно заменяем версию плагина на стабильную прямо в файле build.gradle!
    - name: Force Fix Build File Version
      run: |
        sed -i "s/1.7-SNAPSHOT/1.7.4/g" build.gradle

    # Запускаем сборку — теперь у Gradle нет шансов использовать старые ссылки
    - name: Build Mod with Gradle
      run: gradle build

    - name: Upload Finished Jar
      uses: actions/upload-artifact@v4
      with:
        name: TriggerBot-Fabric-1.21.1
        path: build/libs/*-snapshot.jar
