name: Build Fabric Mod (1.21.1)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Поднимаем окружение Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'

    # Принудительно запускаем сборку с полным отключением ЛЮБОГО кэша (--no-build-cache)
    # Это заставит сервер физически перечитать ваши новые файлы с iPad
    - name: Build Fabric Mod
      run: gradle build --no-daemon --no-build-cache
