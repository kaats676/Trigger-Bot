name: Build Fabric Mod (1.21.1)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Используем встроенный в саму систему Ubuntu установщик Gradle.
    # Он берёт дистрибутив из внутреннего зеркала GitHub, это не тратит ваш интернет и работает мгновенно!
    - name: Install System Gradle
      run: |
        sudo apt-get update-minimal || true
        sudo apt-get install -y gradle
        gradle -v

    # Запускаем сборку напрямую через системный Gradle
    - name: Build Fabric Mod
      run: gradle build --no-daemon

    - name: Upload Finished Mod
      uses: actions/upload-artifact@v4
      with:
        name: fabric-mod-1.21.1
        path: |
          build/libs/*.jar
          !build/libs/*-sources.jar
          !build/libs/*-dev.jar
