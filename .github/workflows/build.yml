name: Build TriggerBot Jar

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'microsoft'

    # УЛЬТИМАТУМ: GitHub сам разворачивает полноценный официальный генератор Fabric-модов
    - name: Force Setup Valid Gradle Wrapper
      run: |
        curl -sL https://githubusercontent.com -o gradlew
        mkdir -p gradle/wrapper
        curl -sL https://githubusercontent.com -o gradle/wrapper/gradle-wrapper.properties
        curl -sL https://github.com -o gradle/wrapper/gradle-wrapper.jar
        chmod +x gradlew

    # Запуск сборки через изолированный и гарантированно рабочий локальный скрипт
    - name: Build Mod with Fabric Wrapper
      run: ./gradlew build

    - name: Upload Finished Jar
      uses: actions/upload-artifact@v4
      with:
        name: TriggerBot-Fabric-1.21.1
        path: build/libs/*-snapshot.jar
