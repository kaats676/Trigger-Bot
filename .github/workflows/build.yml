name: Build Fabric Mod (1.21.1)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Fabric Mod
      run: gradle build

    - name: Upload Finished Mod
      uses: actions/upload-artifact@v4
      with:
        name: fabric-mod-1.21.1
        # Исключаем исходники (-sources) и обычные немиксованные jar (-dev), 
        # чтобы остался только готовый к установке в Майнкрафт файл.
        path: |
          build/libs/*.jar
          !build/libs/*-sources.jar
          !build/libs/*-dev.jar
