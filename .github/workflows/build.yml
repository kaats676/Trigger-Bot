name: Build Fabric Mod (1.21.1)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'

    # Переходим во вложенную папку Trigger-Bot и создаем обертку там,
    # где физически лежат файлы build.gradle и settings.gradle
    - name: Generate Gradle Wrapper
      working-directory: Trigger-Bot
      run: |
        touch empty.gradle
        gradle wrapper --gradle-version 8.10 -b empty.gradle --no-daemon
        chmod +x gradlew
        rm empty.gradle

    # Запускаем изолированную сборку строго внутри папки Trigger-Bot
    - name: Build Fabric Mod
      working-directory: Trigger-Bot
      run: ./gradlew build --no-daemon

    - name: Upload Finished Mod
      uses: actions/upload-artifact@v4
      with:
        name: fabric-mod-1.21.1
        path: |
          Trigger-Bot/build/libs/*.jar
          !Trigger-Bot/build/libs/*-sources.jar
          !Trigger-Bot/build/libs/*-dev.jar
