name: Build Fabric Mod (1.21.1)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Настраиваем окружение Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'

    # Генерируем обёртку, принудительно игнорируя build.gradle,
    # чтобы избежать циклической ошибки с поиском плагина
    - name: Generate Gradle Wrapper
      run: |
        touch empty.gradle
        gradle wrapper --gradle-version 8.10 -b empty.gradle --no-daemon
        chmod +x gradlew
        rm empty.gradle

    # Запускаем сборку ТОЛЬКО через изолированный локальный ./gradlew
    - name: Build Fabric Mod
      run: ./gradlew build --no-daemon

    - name: Upload Finished Mod
      uses: actions/upload-artifact@v4
      with:
        name: fabric-mod-1.21.1
        path: |
          build/libs/*.jar
          !build/libs/*-sources.jar
          !build/libs/*-dev.jar
