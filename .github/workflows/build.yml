name: Build TriggerBot Jar

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'microsoft'

    # ХИТРОСТЬ: Сам GitHub скачивает официальный работающий gradlew для Fabric
    - name: Download Gradle Wrapper Components
      run: |
        wget https://githubusercontent.com
        mkdir -p gradle/wrapper
        wget https://githubusercontent.com -O gradle/wrapper/gradle-wrapper.properties
        wget https://github.com -O gradle/wrapper/gradle-wrapper.jar
        chmod +x gradlew

    # Собираем официальным изолированным методом Fabric
    - name: Build Mod with Gradle Wrapper
      run: ./gradlew build

    - name: Upload Finished Jar
      uses: actions/upload-artifact@v4
      with:
        name: TriggerBot-Fabric-1.21.1
        path: build/libs/*-snapshot.jar
