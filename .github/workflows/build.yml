name: Build Fabric Mod (1.21.1)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Скачиваем чистый Gradle напрямую, обходя глючные плагины GitHub Actions
    - name: Install Clean Gradle
      run: |
        sudo wget -q https://gradle.org
        sudo unzip -q gradle-8.10-bin.zip -d /opt
        echo "/opt/gradle-8.10/bin" >> $GITHUB_PATH

    # Запускаем сборку напрямую в корне без посредников
    - name: Build Fabric Mod
      run: gradle build --no-daemon

    - name: Upload Finished Mod
      uses: actions/upload-artifact@v4
      with:
        name: fabric-mod-1.21.1
        path: |
          build/libs/*.jar
          !build/libs/*-sources.jar
          !build/libs/*-dev.jar
